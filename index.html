<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Phantom Forge Core Online Judge - Coding, Contest, Ranking and Chat"
  >

  <title>Phantom Forge Core OJ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="appBackground"></div>

  <header class="topbar">

    <a href="#home" class="brand" data-route="home">
      <div class="brand-logo">P</div>

      <div class="brand-copy">
        <strong>PHANTOM FORGE</strong>
        <span>CORE ONLINE JUDGE</span>
      </div>
    </a>

    <button
      class="mobile-menu-btn"
      id="mobileMenuBtn"
      type="button"
      aria-label="Mở menu"
    >
      ☰
    </button>

    <nav class="main-nav" id="mainNav">

      <a href="#home" data-route="home">
        Trang chủ
      </a>

      <a href="#problems" data-route="problems">
        Bài tập
      </a>

      <a href="#contests" data-route="contests">
        Kỳ thi
      </a>

      <a href="#submissions" data-route="submissions">
        Bài nộp
      </a>

      <a href="#ranking" data-route="ranking">
        Xếp hạng
      </a>

      <a href="#users" data-route="users">
        Thành viên
      </a>

      <a href="#chat" data-route="chat">
        Chat
      </a>

    </nav>

    <div class="header-actions">

      <button
        class="icon-btn"
        id="themeToggle"
        type="button"
        title="Đổi giao diện"
      >
        ☀️
      </button>

      <div
        class="header-stat hidden"
        id="orbWallet"
        title="Số Orb"
      >
        <span>◉</span>
        <strong id="orbAmount">10</strong>
      </div>

      <button
        class="btn btn-secondary"
        id="loginBtn"
        type="button"
      >
        Đăng nhập
      </button>

      <button
        class="btn btn-primary"
        id="registerBtn"
        type="button"
      >
        Đăng ký
      </button>

      <div class="account-menu hidden" id="accountMenu">

        <button
          class="account-trigger"
          id="accountTrigger"
          type="button"
        >
          <span id="headerAvatar"></span>

          <span class="account-info">
            <strong id="headerUsername">User</strong>
            <small id="headerRole">Member</small>
          </span>

          <span class="account-arrow">⌄</span>
        </button>

        <div
          class="account-dropdown hidden"
          id="accountDropdown"
        >

          <button data-route="profile">
            👤 Hồ sơ
          </button>

          <button data-route="chat">
            💬 Tin nhắn
          </button>

          <button
            id="adminDashboardBtn"
            class="hidden"
            data-route="admin"
          >
            ⚙ Quản trị
          </button>

          <button id="logoutBtn">
            ↪ Đăng xuất
          </button>

        </div>

      </div>

    </div>

  </header>


  <main id="app"></main>


  <footer class="footer">

    <div>
      <strong>Phantom Forge Core OJ</strong>

      <p>
        Nơi ý tưởng được rèn thành thuật toán.
      </p>
    </div>

    <div class="footer-right">
      <span>
        © <span id="currentYear"></span>
      </span>

      <span>
        HTML · CSS · JavaScript
      </span>
    </div>

  </footer>


  <!-- AUTH MODAL -->

  <div
    class="modal hidden"
    id="authModal"
  >

    <div
      class="modal-backdrop"
      data-close-modal="authModal"
    ></div>

    <section class="modal-card auth-card">

      <button
        class="modal-close"
        data-close-modal="authModal"
        type="button"
      >
        ×
      </button>

      <div class="auth-header">

        <div class="auth-logo">
          PF
        </div>

        <span class="eyebrow">
          PHANTOM FORGE CORE
        </span>

        <h2 id="authTitle">
          Đăng nhập
        </h2>

        <p id="authDescription">
          Chào mừng bạn quay trở lại.
        </p>

      </div>


      <div class="auth-tabs">

        <button
          class="auth-tab active"
          data-auth-tab="login"
          type="button"
        >
          Đăng nhập
        </button>

        <button
          class="auth-tab"
          data-auth-tab="register"
          type="button"
        >
          Đăng ký
        </button>

      </div>


      <form
        id="loginForm"
        class="auth-form"
      >

        <label>
          Tên đăng nhập

          <input
            id="loginUsername"
            type="text"
            autocomplete="username"
            minlength="3"
            maxlength="24"
            required
            placeholder="Ví dụ: admin"
          >

        </label>


        <label>
          Mật khẩu

          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Nhập mật khẩu"
          >

        </label>


        <button
          class="btn btn-primary full"
          type="submit"
        >
          Đăng nhập
        </button>

        <div class="demo-login">
          <strong>Tài khoản demo:</strong>

          <span>
            admin / admin123
          </span>

          <span>
            coder1 / 123456
          </span>
        </div>

      </form>


      <form
        id="registerForm"
        class="auth-form hidden"
      >

        <div class="form-grid">

          <label>
            Username

            <input
              id="registerUsername"
              type="text"
              minlength="3"
              maxlength="24"
              required
              placeholder="Username"
            >
          </label>


          <label>
            Tên hiển thị

            <input
              id="registerDisplayName"
              type="text"
              maxlength="40"
              required
              placeholder="Tên của bạn"
            >
          </label>


          <label class="form-span-2">
            Email

            <input
              id="registerEmail"
              type="email"
              maxlength="120"
              required
              placeholder="you@example.com"
            >
          </label>


          <label>
            Mật khẩu

            <input
              id="registerPassword"
              type="password"
              minlength="6"
              required
              placeholder="Tối thiểu 6 ký tự"
            >
          </label>


          <label>
            Nhập lại

            <input
              id="registerPasswordConfirm"
              type="password"
              minlength="6"
              required
              placeholder="Nhập lại mật khẩu"
            >
          </label>

        </div>


        <button
          class="btn btn-primary full"
          type="submit"
        >
          Tạo tài khoản
        </button>

      </form>

    </section>

  </div>


  <!-- SUBMIT MODAL -->

  <div
    class="modal hidden"
    id="submitModal"
  >

    <div
      class="modal-backdrop"
      data-close-modal="submitModal"
    ></div>

    <section class="modal-card submit-card">

      <button
        class="modal-close"
        data-close-modal="submitModal"
        type="button"
      >
        ×
      </button>

      <div id="submitModalContent"></div>

    </section>

  </div>


  <!-- TOAST -->

  <div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
  ></div>


  <script src="script.js"></script>

</body>
</html>
